# Active ESL Waydroid vendor defaults
#
# This file is intentionally policy-free. It establishes a version-controlled
# vendor-owned configuration location for later device identity, provisioning,
# certificate, and appliance settings. Runtime consumers must define a schema
# before relying on a value here.
schema_version=1
owner=Active ESL

# Kiosk is disabled until the controller has been explicitly provisioned as
# Android's device owner. This file is descriptive; enforcement lives in the
# controller and DevicePolicyManager, never in an unchecked property alone.
kiosk.mode=available
kiosk.controller_package=uk.co.activeesl.kioskcontroller
