name: Resolve Android R13 / LineageOS 20 source lock
run-name: Resolve Android R13 / LineageOS 20 source lock - ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Android R13 / LineageOS 20 source lock
    runs-on: [self-hosted, Linux, esl-proxmox]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-pinned repo launcher
        run: aesl/scripts/install-repo-tool.sh
      - name: Resolve complete immutable manifest
        env:
          AESL_VENDOR_REVISION: ${{ github.sha }}
          ANDROID_WORKSPACE: /yocto/actions-runner-cache/aesl-android-source
          LOCK_OUTPUT: ${{ github.workspace }}/source-manifest.xml
        run: aesl/scripts/resolve-lock.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-r13-lineage-20-source-lock-${{ github.sha }}
          path: source-manifest.xml
          if-no-files-found: error
