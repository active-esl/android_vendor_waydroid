name: Validate AESL production gates

on:
  push:
    branches: [lineage-23.2-aesl]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned SDK 36 hwcomposer
        uses: actions/checkout@v4
        with:
          repository: active-esl/android_hardware_waydroid
          ref: b92200ac592ed43acd9f1f1bc41c09bc407b1732
          path: .ci-source/hardware/waydroid
          persist-credentials: false
      - name: Check out pinned Android 16 Soong
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_build_soong
          ref: 9aa045a2aef10b8089e32e847fed26d9aa3d61be
          path: .ci-source/build/soong
          persist-credentials: false
      - name: Check out pinned Waydroid FFmpeg
        uses: actions/checkout@v4
        with:
          repository: waydroid/android_external_ffmpeg
          ref: c5b53ceda3390c614bc10095d31f7be6b29337eb
          path: .ci-source/external/ffmpeg
          persist-credentials: false
      - name: Check out production patch tooling and lock
        uses: actions/checkout@v4
        with:
          repository: active-esl/waydroid-product-manifest
          ref: 6afd53a666f3ab42fabb88d7f8b9a6a982084819
          path: .ci-tools/product-manifest
          persist-credentials: false
      - name: Assemble Android production source paths
        run: |
          mkdir -p .ci-source/.repo .ci-source/vendor
          ln -s "$GITHUB_WORKSPACE" .ci-source/vendor/extra
      - name: Require SELinux neverallow enforcement
        run: |
          if grep -R --line-number --fixed-strings --exclude-dir=.git \
              --include='*.mk' --include='*.bp' --include='*.te' \
              'SELINUX_IGNORE_NEVERALLOWS := true' .; then
            echo 'AESL production branch must not bypass SELinux neverallow rules' >&2
            exit 1
          fi
      - name: Require complete runtime SELinux exception inventory
        run: |
          python3 scripts/check-selinux-runtime-gate.py
          grep -Fq 'selinux-runtime-exception.json:$(TARGET_COPY_OUT_VENDOR)/etc/aesl/selinux-runtime-exception.json' product.mk
      - name: Require pinned SDK 36 patch dependencies
        run: |
          python3 scripts/check-waydroid-patch-dependencies.py \
            --manifest manifest_scripts/manifests-36/02-waydroid.xml \
            --requirements waydroid-patches/base-patches-36/required-revisions.tsv \
            --source-root .ci-source
          grep -Fq 'GraphicBufferMapper::get()' .ci-source/hardware/waydroid/hwcomposer/gralloc_handler.cpp
          grep -Fq 'getPixelFormatFourCC' .ci-source/hardware/waydroid/hwcomposer/gralloc_handler.cpp
          grep -Fq 'getPixelFormatModifier' .ci-source/hardware/waydroid/hwcomposer/gralloc_handler.cpp
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          projects = {
              project.get("path"): project.get("revision")
              for project in ET.parse(".ci-tools/product-manifest/locks/lineage-23.2-lock.xml").getroot().findall("project")
          }
          assert projects["build/soong"] == "9aa045a2aef10b8089e32e847fed26d9aa3d61be"
          assert projects["external/ffmpeg"] == "c5b53ceda3390c614bc10095d31f7be6b29337eb"
          PY
          .ci-tools/product-manifest/scripts/apply-waydroid-patches-strict.sh "$GITHUB_WORKSPACE/.ci-source" build/soong
          find .ci-source/external/ffmpeg -name Android.mk -printf 'external/ffmpeg/%P\n' | sort > /tmp/ffmpeg-androidmks
          sed -n '/^var androidmk_allowlist/,/^}/p' .ci-source/build/soong/ui/build/androidmk_denylist.go | grep -o '"external/ffmpeg[^"]*Android.mk"' | tr -d '"' | sort > /tmp/soong-ffmpeg-allowlist
          diff -u /tmp/ffmpeg-androidmks /tmp/soong-ffmpeg-allowlist
          bash -n waydroid-patches/apply-patches.sh
