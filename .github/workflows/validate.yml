name: Validate AESL image pipeline

on:
  pull_request:
  push:
    branches: [lineage-20]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell
        run: bash -n aesl/scripts/common.sh aesl/scripts/resolve-lock.sh aesl/scripts/build-images.sh
      - name: Validate Python
        run: python3 -m py_compile aesl/scripts/write-build-info.py
      - name: Check source-lock policy
        run: |
          if grep -R 'refs/heads/' aesl/manifests --include='*-lock.xml'; then
            echo 'Source locks must contain immutable revisions' >&2
            exit 1
          fi
